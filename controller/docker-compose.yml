services:
  echomuse-controller:
    build:
      # Root context is required for the deployed BCResNet registry seed.
      context: ..
      dockerfile: controller-rs/Dockerfile
    container_name: echomuse-controller
    restart: unless-stopped
    network_mode: host
    environment:
      - DB_PATH=/app/data/echomuse.db
    env_file:
      - .env
    volumes:
      # Persist database across container rebuilds
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
