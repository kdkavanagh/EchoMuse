name: "EchoMuse"
# Tracks the published controller image tag, which controller-release.yml
# derives from the controller-v* tag (controller-v2.18.0 -> 2.18.0). Bump
# both together: Supervisor pulls `image:version`, so a version with no
# matching tag on GHCR fails to install.
version: "2.19.0"
# Pull the published multi-architecture image; this directory holds only the
# add-on manifest and shared assets, with no Dockerfile for Supervisor to
# build from. The image is built from controller-rs/Dockerfile by
# controller-release.yml, which passes EM_CONTROLLER_VERSION (so the
# dashboard and the update notice see the release) and publishes
# linux/amd64 and linux/arm64, matching the arch list below.
image: "ghcr.io/wilbowes/echomuse-controller"
slug: "controller"
description: "Local, open-source voice assistant controller for rooted Echo Dot 2nd Gen devices — wake word, fleet dashboard, and Home Assistant integration via ESPHome."
url: "https://github.com/wilbowes/EchoMuse"
init: false
arch:
  - aarch64
  - amd64
# Required for mDNS controller discovery and the native ESPHome API listener
# for each device (one TCP port per device, 16001+) — the same reason the
# docker-compose deployment sets network_mode: host. Without it, devices on
# the LAN cannot find or connect to the controller.
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 8768
panel_icon: mdi:microphone-message
panel_title: EchoMuse
environment:
  ECHOMUSE_HOME_ASSISTANT_INGRESS: "true"
  # /data is the add-on's own persistent storage, provided automatically by
  # Supervisor — fixed rather than a user option so the database can't be
  # pointed somewhere that doesn't survive a restart.
  DB_PATH: "/data/echomuse.db"
options:
  server_host: "0.0.0.0"
  server_ip: ""
  mdns_name: "echomuse"
  esphome_project_version: "2.0.0"
  require_device_tls: false
  device_approval: "strict"
schema:
  server_host: "str"
  server_ip: "str"
  mdns_name: "match(^[a-z0-9][a-z0-9-]{0,62}$)"
  esphome_project_version: "str"
  require_device_tls: "bool"
  device_approval: "list(strict|auto)"
