[mypy]
python_version = 3.12
files = em_*.py, echomuse_grammar, esphome, tools
exclude = (^|/)esphome/vendor/
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Generated protobuf bindings. They ship no .pyi (types-protobuf covers only
# google.protobuf itself), so their message classes are unknowable statically:
# importing them yields Any rather than hundreds of attr-defined errors.
[mypy-esphome.vendor.*]
follow_imports = skip

# Runtimes without type information. The model runtimes are not installed in
# CI (their tests skip), and scipy ships no py.typed marker.
[mypy-onnxruntime.*,sherpa_onnx.*,scipy.*]
ignore_missing_imports = True
