name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Controller (controller-rs) ───────────────────────────────────────────
  #
  # The controller is the Rust workspace in controller-rs/. Each job installs
  # the toolchain controller-rs/rust-toolchain.toml names, read from that file
  # so the pin lives in one place (the image's rust:<version> base moves with
  # it), and runs cargo with --locked so a Cargo.lock that does not match the
  # manifests fails here instead of resolving afresh. controller/ keeps the old
  # Python controller as reference only; nothing here builds or runs it.
  controller-fmt:
    name: Controller format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        working-directory: controller-rs
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
      - name: Run cargo fmt
        working-directory: controller-rs
        run: cargo fmt --all -- --check

  controller-clippy:
    name: Controller lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        working-directory: controller-rs
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            controller-rs/native/.downloads
          key: rs-deps-${{ runner.os }}-${{ hashFiles('controller-rs/Cargo.lock', 'controller-rs/tools/fetch-native.sh', 'controller-rs/crates/speech/src/pins.rs') }}
          restore-keys: rs-deps-${{ runner.os }}-
      # The controller links the pinned sherpa-onnx libraries; build.rs stops
      # the build without them. The script checks every download and library
      # against the SHA-256 in crates/speech/src/pins.rs, and
      # .cargo/config.toml points SHERPA_ONNX_LIB_DIR at what it unpacks.
      - name: Fetch the pinned native libraries
        working-directory: controller-rs
        run: tools/fetch-native.sh
      - name: Run cargo clippy
        working-directory: controller-rs
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  controller-tests:
    name: Controller tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        working-directory: controller-rs
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
      # The playback, sound-export and voice tests run the real decoder at
      # /usr/bin/ffmpeg, as the image does.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            controller-rs/native/.downloads
          key: rs-deps-${{ runner.os }}-${{ hashFiles('controller-rs/Cargo.lock', 'controller-rs/tools/fetch-native.sh', 'controller-rs/crates/speech/src/pins.rs') }}
          restore-keys: rs-deps-${{ runner.os }}-
      - name: Fetch the pinned native libraries
        working-directory: controller-rs
        run: tools/fetch-native.sh
      # Tests that need downloaded models, live multicast, a Python with
      # aioesphomeapi or a copied installation are #[ignore]d and do not run
      # here; controller-rs/README.md lists how to run them by hand.
      - name: Run cargo test
        working-directory: controller-rs
        run: cargo test --locked --workspace --all-targets --all-features

  controller-audit:
    name: Controller dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # The fast check against the RustSec advisory database, from Cargo.lock
      # alone; nothing is compiled. The published image cannot stand in for it:
      # the controller binary is not built with cargo-auditable, so an image
      # scan sees the Debian layer but not the crates inside the binary. The
      # weekly scan in security-scan.yml covers the same lockfile on unchanged
      # code.
      #
      # Report-only, deliberately. A dependency audit that goes red on an
      # advisory with no fix available teaches people to ignore a red X,
      # which costs more than the job earns.
      - name: Audit Cargo.lock
        run: |
          if ! cargo audit --file controller-rs/Cargo.lock; then
            echo "::warning::cargo audit reported vulnerabilities — see the log"
          fi

  dashboard-tests:
    name: Dashboard logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-node step: ubuntu-latest ships a node, and this test needs
      # nothing beyond the standard library. The dashboard is otherwise
      # untested by construction — it compiles to a single classic script
      # with no module boundary to import across — so this covers the pure
      # logic that decides what the wizard will and will not attempt.
      - name: Run dashboard tests
        run: |
          node controller/tests/wifi_scan.test.mjs
          node controller/tests/provision_wizard.test.mjs
          node controller/tests/capability_gap.test.mjs

  device-tests:
    name: Device Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # GoTinyAlsa, used by device/tools/{capture_mics,bf_capture}
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      # cmd/ imports the hardware bindings, which carry //go:build server
      # (device builds pass -tags server) — listing cmd on a host platform
      # fails package setup. Wildcards skip tag-excluded packages, so
      # internal/... + pkg/... + tools/... covers every host-testable package
      # (tools/capture_mics and bf_capture are modules of their own, outside
      # the pattern; tools/sl_latency/latency is the firmware module's).
      - name: Run go test
        working-directory: device
        run: go test ./internal/... ./pkg/... ./tools/...

  companion-build:
    name: Companion app build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Echo Show companion app and Kiosk Satellite plugin
      # (device/companion), built by the image's `companion` stage exactly as
      # the firmware embeds them: the link codec and turn view tests on the
      # JDK (a failure fails the stage), then compile, package, sign and
      # verify the APK, and build the plugin ZIP and check its size. Only that
      # stage; the firmware and the controller image are not built here.
      # ubuntu-latest is x86-64, which aapt2 and zipalign need.
      - name: Build the companion stage
        run: docker build -f controller-rs/Dockerfile --target companion .

  device-vulncheck:
    name: Device Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # govulncheck reports only vulnerabilities on REACHABLE call paths, so
      # it is low-noise enough to read every time — unlike a plain dependency
      # diff, most of which never executes.
      #
      # One blind spot worth stating rather than discovering later: both cgo
      # libraries are dlopen'd at runtime rather than linked, so neither is in
      # this module graph at all. ONNX Runtime's version is pinned by AAR
      # sha256 in the asset path instead; libmixerAPI is whatever /system/lib
      # ships, on a platform that cannot be updated.
      #
      # Same package scope as go vet: cmd/ carries //go:build server and
      # fails package setup on a host platform.
      - name: Run govulncheck
        working-directory: device
        run: govulncheck ./internal/... ./pkg/... || true

  device-vet:
    name: Device go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      - name: Run go vet
        working-directory: device
        run: go vet ./internal/... ./pkg/... ./tools/...
