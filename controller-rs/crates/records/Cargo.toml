[package]
name = "echomuse-records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
echomuse-core = { version = "0.1.0", path = "../core" }
echomuse-db = { version = "0.1.0", path = "../db" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
echomuse-turn = { version = "0.1.0", path = "../turn" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid = { version = "1.29", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
