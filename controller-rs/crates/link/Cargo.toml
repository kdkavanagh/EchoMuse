[package]
name = "echomuse-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
echomuse-config = { version = "0.1.0", path = "../config" }
echomuse-core = { version = "0.1.0", path = "../core" }
echomuse-db = { version = "0.1.0", path = "../db" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
http = "1.5"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
subtle = "2.6.1"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { workspace = true, features = ["rt", "time"] }
tracing = "0.1.44"
uuid = { version = "1.29", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
