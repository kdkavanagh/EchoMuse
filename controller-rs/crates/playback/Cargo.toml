[package]
name = "echomuse-playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
echomuse-esphome = { version = "0.1.0", path = "../esphome" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
tokio.workspace = true
tokio-util.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["test-util"] }
