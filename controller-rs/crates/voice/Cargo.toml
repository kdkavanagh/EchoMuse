[package]
name = "echomuse-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Stand-in speech models for tests of the crates that drive this one (no model files).
testing = []

[dependencies]
bytes.workspace = true
echomuse-alerts = { version = "0.1.0", path = "../alerts" }
echomuse-core = { version = "0.1.0", path = "../core" }
echomuse-echo = { version = "0.1.0", path = "../echo" }
echomuse-esphome = { version = "0.1.0", path = "../esphome" }
echomuse-grammar = { version = "0.1.0", path = "../grammar" }
echomuse-playback = { version = "0.1.0", path = "../playback" }
echomuse-presentation = { version = "0.1.0", path = "../presentation" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
echomuse-recorder = { version = "0.1.0", path = "../recorder" }
echomuse-records = { version = "0.1.0", path = "../records" }
echomuse-settings = { version = "0.1.0", path = "../settings" }
echomuse-speech = { version = "0.1.0", path = "../speech" }
echomuse-turn = { version = "0.1.0", path = "../turn" }
echomuse-uplink = { version = "0.1.0", path = "../uplink" }
jiff = "0.2.38"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing = "0.1.44"
uuid = { version = "1.29", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27"
