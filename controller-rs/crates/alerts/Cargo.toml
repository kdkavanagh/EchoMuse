[package]
name = "echomuse-alerts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
echomuse-core = { version = "0.1.0", path = "../core" }
echomuse-db = { version = "0.1.0", path = "../db" }
echomuse-ha = { version = "0.1.0", path = "../ha" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
rusqlite = "0.41.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid = { version = "1.29.0", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "rt", "macros"] }
