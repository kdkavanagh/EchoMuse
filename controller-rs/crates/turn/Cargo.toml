[package]
name = "echomuse-turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Builds the offline evaluation tools (`examples/evaluate_recordings.rs` and
# `examples/evaluate_pause_server.rs`), which run the pinned speech models (and the grammar)
# over saved turn recordings. The library itself never needs them.
evaluate = ["dep:echomuse-speech", "dep:echomuse-grammar", "dep:rusqlite", "dep:serde_json"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
echomuse-speech = { path = "../speech", optional = true }
echomuse-grammar = { path = "../grammar", optional = true }
rusqlite = { version = "0.41.1", optional = true, features = ["bundled"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "evaluate_recordings"
required-features = ["evaluate"]

[[example]]
name = "evaluate_pause_server"
required-features = ["evaluate"]
