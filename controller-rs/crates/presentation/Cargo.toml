[package]
name = "echomuse-presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
echomuse-alerts = { version = "0.1.0", path = "../alerts" }
echomuse-esphome = { version = "0.1.0", path = "../esphome" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
echomuse-records = { version = "0.1.0", path = "../records" }
echomuse-settings = { version = "0.1.0", path = "../settings" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "macros", "rt", "rt-multi-thread"] }
