[package]
name = "echomuse-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
bcrypt = "0.19.3"
crc32fast = "1.5.3"
echomuse-core = { version = "0.1.0", path = "../core" }
echomuse-db = { version = "0.1.0", path = "../db" }
echomuse-firmware = { version = "0.1.0", path = "../firmware" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
echomuse-records = { version = "0.1.0", path = "../records" }
echomuse-settings = { version = "0.1.0", path = "../settings" }
echomuse-wyoming = { version = "0.1.0", path = "../wyoming" }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
subtle = "2.6.1"
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs"] }
url = "2.5.8"

[dev-dependencies]
bytes = "1"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.30.0"
zip = { version = "2.6.1", default-features = false }
echomuse-wyoming = { path = "../wyoming", features = ["testing"] }
