[package]
name = "echomuse-recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
crc32fast = "1.5"
echomuse-core = { version = "0.1.0", path = "../core" }
echomuse-echo = { version = "0.1.0", path = "../echo" }
echomuse-protocol = { version = "0.1.0", path = "../protocol" }
echomuse-turn = { version = "0.1.0", path = "../turn" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = "2.0.21"
uuid = { version = "1.29", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
